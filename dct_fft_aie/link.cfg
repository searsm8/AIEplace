[connectivity]
# One PL kernel instance.
nk=top:1:top_1

# Wire the PL kernel's 8 send + 8 recv AXIS streams to the AIE FFT pool PLIO ports.
# PL port names: top.cpp (fft_to_aie_<i> / fft_from_aie_<i>).
# AIE PLIO names: DensityFFTGraph.h (fft_in_<i> / fft_out_<i>).
stream_connect=top_1.fft_to_aie_0:ai_engine_0.fft_in_0
stream_connect=top_1.fft_to_aie_1:ai_engine_0.fft_in_1
stream_connect=top_1.fft_to_aie_2:ai_engine_0.fft_in_2
stream_connect=top_1.fft_to_aie_3:ai_engine_0.fft_in_3
stream_connect=top_1.fft_to_aie_4:ai_engine_0.fft_in_4
stream_connect=top_1.fft_to_aie_5:ai_engine_0.fft_in_5
stream_connect=top_1.fft_to_aie_6:ai_engine_0.fft_in_6
stream_connect=top_1.fft_to_aie_7:ai_engine_0.fft_in_7

stream_connect=ai_engine_0.fft_out_0:top_1.fft_from_aie_0
stream_connect=ai_engine_0.fft_out_1:top_1.fft_from_aie_1
stream_connect=ai_engine_0.fft_out_2:top_1.fft_from_aie_2
stream_connect=ai_engine_0.fft_out_3:top_1.fft_from_aie_3
stream_connect=ai_engine_0.fft_out_4:top_1.fft_from_aie_4
stream_connect=ai_engine_0.fft_out_5:top_1.fft_from_aie_5
stream_connect=ai_engine_0.fft_out_6:top_1.fft_from_aie_6
stream_connect=ai_engine_0.fft_out_7:top_1.fft_from_aie_7

[vivado]
# Speeds up hw_emu xsim elaboration (harmless for hw).
prop=fileset.sim_1.xsim.elaborate.xelab.more_options={-override_timeprecision -timescale=1ns/1ps}
